<div class="login-page container-fluid d-flex align-items-center justify-content-center p-3 p-sm-4">
  <div class="login-shell row w-100">
    <aside class="login-story col-lg-5 d-none d-lg-flex flex-column justify-content-between p-5">
      <div class="d-flex align-items-center gap-3">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span class="fw-semibold">Employee Portal</span>
      </div>

      <div>
        <p class="story-label mb-3">Employee workspace</p>
        <h1 class="display-5 fw-semibold mb-3">Good work starts with a clear view.</h1>
        <p class="text-white-50 mb-0">
          Sign in to continue to your employee workspace.
        </p>
      </div>

      <p class="small text-white-50 mb-0">Employees OPERATIONS</p>
    </aside>

    <main class="login-panel col-12 col-lg-7 d-flex align-items-center justify-content-center p-4 p-sm-5">
      <section class="login-content w-100" aria-labelledby="login-title">
        <div class="d-flex d-lg-none align-items-center gap-3 mb-5">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span class="fw-semibold">People Portal</span>
        </div>

        <p class="text-secondary small fw-semibold text-uppercase mb-2">Sign in</p>
        <h2 id="login-title" class="h2 fw-semibold mb-2">Welcome back</h2>
        <p class="text-secondary mb-4">Enter your details to access your account.</p>

        <form>
          <div class="mb-3">
            <label for="email" class="form-label fw-medium">Email address</label>
            <input
              id="email"
              class="form-control login-control"
              type="email"
              name="email"
              [(ngModel)] = "loginobj.email"
              placeholder="name@company.com"
              autocomplete="username"
              required
            >
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-medium">Password</label>
            <input
              id="password"
              class="form-control login-control"
              type="password"
              name="password"
              [(ngModel)] = "loginobj.contactno"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input id="remember" class="form-check-input" type="checkbox" name="remember">
              <label class="form-check-label text-secondary" for="remember">Remember me</label>
            </div>
            <a class="login-link small fw-semibold" href="#">Forgot password?</a>
          </div>

          <button  type ="button" (click)="onLogin()" class = "login-button btn w-100" type="button">Sign in</button>
        </form>
      </section>
    </main>
  </div>
</div>
